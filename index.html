<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#18332b">
<title>Pocket Register</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f5f4f0;--panel:#fff;--ink:#1d2321;--muted:#5f6b66;--line:#e2e0d9;--soft:#efeee8;--brand:#1f5c4a;--dark:#18332b;--pos:#1d7a4f;--neg:#b3362b;--warn:#a86500;--warn-soft:#fbefd9;--neg-soft:#f8e3e0;--brand-soft:#e3efe9;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:16px;color:var(--ink)}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{margin:0;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:5;background:var(--dark);color:#fff;padding:12px 16px calc(12px);display:flex;align-items:center;gap:10px}
header .logo{width:30px;height:30px;border-radius:8px;background:#e3efe9;color:var(--dark);display:grid;place-items:center;font-weight:700;font-size:12px}
header h1{font-size:17px;margin:0;flex:1}
header button{background:rgba(255,255,255,.12);border:0;color:#fff;border-radius:8px;padding:6px 10px;font-size:13px}
main{padding:14px 14px 96px;max-width:640px;margin:0 auto}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card h2{font-size:15px;margin:0 0 10px;display:flex;justify-content:space-between;align-items:baseline}
.card h2 small{font-weight:400;color:var(--muted);font-size:12px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .nm{font-weight:600}
.row .sub{font-size:12px;color:var(--muted)}
.num{font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.big{font-size:26px;font-weight:700}
.muted{color:var(--muted)} .small{font-size:12px} .pos{color:var(--pos)} .neg{color:var(--neg)}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:20px;background:var(--soft);color:var(--muted);margin-left:4px}
.tag.warn{background:var(--warn-soft);color:var(--warn)} .tag.bad{background:var(--neg-soft);color:var(--neg)} .tag.good{background:var(--brand-soft);color:var(--brand)}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:14px;font-weight:600;background:var(--brand);color:#fff;margin-top:10px}
.btn.sec{background:var(--panel);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--panel);color:var(--neg);border:1px solid #e6c2bd}
.btn:disabled{opacity:.5}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
input,select,textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 12px;background:#fff;font-size:16px}
input:focus,select:focus{outline:2px solid #9cc7b5;border-color:#9cc7b5}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;border:0;background:#fff;padding:10px 6px;font-size:14px}
.seg button.on{background:var(--brand);color:#fff}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.amount{font-size:28px;font-weight:700;text-align:center}
.err{color:var(--neg);font-size:14px;min-height:18px;margin-top:8px}
.note{background:var(--warn-soft);color:#6d4500;border-radius:10px;padding:10px 12px;font-size:13px}
nav.tabs{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav.tabs button{flex:1;border:0;background:none;padding:10px 0 12px;font-size:13px;color:var(--muted)}
nav.tabs button b{display:block;font-size:20px;line-height:1.2}
nav.tabs button.on{color:var(--brand);font-weight:600}
.badge{background:var(--neg);color:#fff;border-radius:10px;font-size:11px;padding:0 6px;margin-left:3px}
.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:var(--dark);color:#fff;padding:10px 16px;border-radius:10px;z-index:20;pointer-events:none;max-width:90%;text-align:center}
.modal{position:fixed;inset:0;background:rgba(15,25,20,.5);display:grid;place-items:end center;z-index:30}
.sheet{background:#fff;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));width:100%;max-width:640px}
.sheet h3{margin:0 0 8px}
.center{text-align:center}
.lockcard{max-width:420px;margin:8vh auto 0}
</style>
</head>
<body>
<header><span class="logo">AR</span><h1 id="title">Pocket Register</h1><button id="btnLock" hidden>Lock</button></header>
<main id="main"></main>
<nav class="tabs" id="tabs" hidden>
  <button data-tab="home" class="on"><b>&#9673;</b>Balances</button>
  <button data-tab="add"><b>&#43;</b>Add</button>
  <button data-tab="outbox"><b>&#8679;</b>Pending<span id="obBadge"></span></button>
</nav>
<div id="toast" class="toast" hidden></div>
<div id="modal" class="modal" hidden><div class="sheet" id="sheet"></div></div>
<input type="file" id="filePick" hidden>
<script>
'use strict';
const APP_ID='AccountRegister', VERSION='2.3';
let LOCK_MIN=0; // 0 = stay signed in until Lock is tapped
/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const usd=new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'});
const money=c=>usd.format((c||0)/100);
const z=n=>String(n).padStart(2,'0');
const isoDate=d=>`${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}`;
const today=()=>isoDate(new Date());
const parseIso=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);};
const fmtDate=s=>{ if(!s) return ''; const[y,m,d]=s.split('-'); return `${m}/${d}/${y}`; };
const addDays=(s,n)=>{const d=parseIso(s);d.setDate(d.getDate()+n);return isoDate(d);};
const daysBetween=(a,b)=>Math.round((parseIso(b)-parseIso(a))/864e5);
const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2);
const nowIso=()=>new Date().toISOString();
function parseMoney(v){ let s=String(v||'').trim().replace(/[$,\s]/g,''); if(!s||!/^\d*\.?\d*$/.test(s)||s==='.') return NaN; return Math.round(parseFloat(s)*100); }
function firstJSON(text){ try{ return JSON.parse(text); }catch(e){} const s=String(text||''), st=s.indexOf('{'); if(st<0) throw new Error('no JSON'); let d=0,q=false,x=false; for(let i=st;i<s.length;i++){ const c=s[i]; if(q){ if(x) x=false; else if(c==='\\') x=true; else if(c==='"') q=false; continue; } if(c==='"') q=true; else if(c==='{') d++; else if(c==='}'&&--d===0) return JSON.parse(s.slice(st,i+1)); } throw new Error('incomplete JSON'); }
function toast(m,ms=2600){ const t=$('#toast'); t.textContent=m; t.hidden=false; clearTimeout(toast.t); toast.t=setTimeout(()=>t.hidden=true,ms); }
const byName=(a,b)=>a.localeCompare(b,undefined,{sensitivity:'base'});
const sum=(a,f)=>a.reduce((s,x)=>s+f(x),0);
/* ---------- crypto (same format as the desktop register) ---------- */
const enc=new TextEncoder(), dec=new TextDecoder();
const b64=buf=>{let s='';const b=new Uint8Array(buf);for(let i=0;i<b.length;i+=0x8000)s+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(s);};
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const normUser=u=>String(u||'').trim().toLowerCase();
async function deriveKey(pass,salt,iter){ const base=await crypto.subtle.importKey('raw',enc.encode(pass),'PBKDF2',false,['deriveKey']); return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']); }
async function openRegister(env,user,pass){
  if((env.format||1)<2) throw new Error('Open this register on your computer once to finish its upgrade, then load it again here.');
  let raw; try{ const w=env.wraps.login; const kek=await deriveKey(normUser(user)+'\n'+pass,unb64(w.salt),w.iter); raw=new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(w.iv)},kek,unb64(w.key))); }
  catch(e){ throw new Error('Username or passphrase is incorrect.'); }
  const key=await crypto.subtle.importKey('raw',raw,{name:'AES-GCM'},false,['encrypt','decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(env.iv)},key,unb64(env.data));
  return {data:JSON.parse(dec.decode(pt)),key};
}
async function sealJSON(obj,key){ const iv=crypto.getRandomValues(new Uint8Array(12)); return {iv:b64(iv),data:b64(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,enc.encode(JSON.stringify(obj))))}; }
async function openJSON(s,key){ return JSON.parse(dec.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(s.iv)},key,unb64(s.data)))); }
/* ---------- storage on the phone (encrypted queue, encrypted register copy) ---------- */
function idb(){ return new Promise((res,rej)=>{ const r=indexedDB.open('pocket-register',1); r.onupgradeneeded=()=>r.result.createObjectStore('kv'); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
async function kvGet(k){ try{ const db=await idb(); return await new Promise(res=>{ const q=db.transaction('kv').objectStore('kv').get(k); q.onsuccess=()=>res(q.result); q.onerror=()=>res(undefined); }); }catch(e){ return undefined; } }
async function kvSet(k,v){ try{ const db=await idb(); await new Promise(res=>{ const t=db.transaction('kv','readwrite'); t.objectStore('kv').put(v,k); t.oncomplete=res; t.onerror=res; }); }catch(e){} }
/* ---------- register logic (mirrors the desktop) ---------- */
const DEFAULT_GROUP={'Checking':'cash','Savings':'cash','Money Market':'cash','Online':'cash','Cash':'cash','Asset':'cash','Debit Card':'cash','Credit Card':'credit','Credit Line':'credit','Loan':'loans','Personal Loan':'loans','Mortgage':'loans','Liability':'bills','Bill':'bills'};
const GROUPS=[{key:'cash',name:'Cash & Banking'},{key:'credit',name:'Credit/Debit'},{key:'loans',name:'Loans'},{key:'bills',name:'Bills'}];
const P={env:null,data:null,key:null,user:null,queue:[],tab:'home',fileName:'',handle:null,live:false,syncing:false};
const FSA=typeof window.showOpenFilePicker==='function';
const groupOf=type=>(P.data.lists.acctTypes||[]).find(t=>t.name===type)?.group||DEFAULT_GROUP[type]||'cash';
const isLiab=a=>groupOf(a.type)!=='cash';
const acctById=id=>P.data.accounts.find(a=>a.id===id);
const openAccounts=()=>P.data.accounts.filter(a=>a.status!=='Closed').sort((a,b)=>Object.keys(DEFAULT_GROUP).indexOf(a.type)-Object.keys(DEFAULT_GROUP).indexOf(b.type)||byName(a.name,b.name));
const inBalance=(t,a)=>!a.openDate||t.date>=a.openDate;
const imported=()=>new Set(P.data.txns.map(t=>t.mobileId).filter(Boolean));
function waiting(){ const done=imported(); return P.queue.filter(e=>!e.op && !done.has(e.id)); }   // new entries not in the register yet
const pendingOps=()=>P.queue.filter(e=>e.op);                                                            // edits and deletes not saved yet
// Apply edits/deletes to a list of transactions. A transfer's other side follows: same date, memo, category,
// class and type, opposite amount. Returns how many were applied (missing transactions are skipped).
function applyOps(txns, ops, mark){
  let n=0;
  for(const o of ops){
    const t=txns.find(x=>x.id===o.txnId); if(!t) continue;
    const mate=t.transferId?txns.find(x=>x.transferId===t.transferId && x.id!==t.id):null;
    if(o.op==='delete'){ for(const x of [t,mate]) if(x){ const i=txns.indexOf(x); if(i>=0) txns.splice(i,1); } n++; continue; }
    const c=o.changes||{}, now=nowIso();
    Object.assign(t,c,{updated:now}); if(mark) t.pendingEdit=true;
    if(mate){ for(const k of ['date','memo','category','cls','type']) if(k in c) mate[k]=c[k]; if('amount' in c) mate.amount=-c.amount; mate.updated=now; if(mark) mate.pendingEdit=true; }
    n++;
  }
  return n;
}
// Everything as it will be once pending work is saved: register + edits/deletes + new entries
function effTxns(){
  const rows=P.data.txns.map(t=>({...t})); applyOps(rows, pendingOps(), true);
  for(const e of waiting()){
    rows.push({id:e.id,accountId:e.accountId,date:e.date,amount:e.amount,payee:e.payee,counterAccountId:e.counterAccountId||null,transferId:e.counterAccountId?'p-'+e.id:null,category:e.category,cls:e.cls,type:e.type,memo:e.memo,status:'U',pending:true,qid:e.id,seq:1e12});
    if(e.counterAccountId) rows.push({id:e.id+'-x',accountId:e.counterAccountId,date:e.date,amount:-e.amount,payee:'',counterAccountId:e.accountId,transferId:'p-'+e.id,category:e.category,cls:e.cls,type:e.type,memo:e.memo,status:'U',pending:true,qid:e.id,mirror:true,seq:1e12});
  }
  return rows;
}
function flows(a){ return sum(effTxns().filter(t=>t.accountId===a.id&&inBalance(t,a)),t=>t.amount); }
const balance=a=>isLiab(a)?(a.openBal||0)-flows(a):(a.openBal||0)+flows(a);
function nextDue(day,from=today()){ const d=parseIso(from), mk=(y,m)=>isoDate(new Date(y,m,Math.min(day,new Date(y,m+1,0).getDate()))); let x=mk(d.getFullYear(),d.getMonth()); if(x<from) x=mk(d.getFullYear(),d.getMonth()+1); return x; }
function dueOf(a){
  const st=P.data.txns.filter(t=>t.accountId===a.id&&t.amount<0&&t.dueDate&&t.dueDate>=addDays(today(),-45)).sort((x,y)=>x.date<y.date?1:-1)[0];
  if(st && balance(a)>0) return {date:st.dueDate, amt:-st.amount, src:'statement'};
  if(a.dueDay) return {date:nextDue(a.dueDay), amt:a.payment||null, src:a.payment?'from setup':''};
  return null;
}
const listNames=k=>(P.data.lists[k]||[]).filter(x=>!x.hidden).map(x=>x.name).sort(byName);
/* ---------- screens ---------- */
function render(){ const v=VIEWS[P.data?P.tab:'lock'](); $('#main').innerHTML=v.html; v.after&&v.after(); $('#tabs').hidden=!P.data; $('#btnLock').hidden=!P.data; $$('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===(P.tab==='acct'?'home':P.tab))); const n=P.data?waiting().filter(e=>P.live||!e.sentAt).length+pendingOps().length:0; $('#obBadge').innerHTML=n?`<span class="badge">${n}</span>`:''; window.scrollTo(0,0); }
const VIEWS={};
VIEWS.lock=()=>({html:`<div class="card lockcard">
  <h2>${P.env?'Unlock your register':'Welcome'}</h2>
  ${P.env?`<p class="small muted" style="margin-top:0">Register file: <b>${esc(P.fileName)}</b>, saved ${esc(new Date(P.env.saved).toLocaleString())}.</p>
    <form id="fLogin" autocomplete="on"><label>Username<input id="lUser" name="username" autocomplete="username" autocapitalize="none" value="${esc(P.lastUser||'')}"></label>
    <label>Passphrase<input id="lPass" name="password" type="password" autocomplete="current-password"></label>
    <div class="err" id="lErr"></div><button class="btn" id="lGo">Unlock</button></form>
    ${P.handle?`<p class="small muted">Unlocking opens the latest copy from OneDrive.</p><button class="btn sec" id="lLoad">Use a different register file</button>`
      :`${FSA?`<div class="note" style="margin-top:12px"><b>One-time step:</b> tap <b>Connect register file</b> and pick register-data.json in OneDrive again. After that, entries save straight into your register with no Send step.</div>`:''}<button class="btn sec" id="lLoad">${FSA?'Connect register file':'Load a newer register file'}</button>`}`
  :`<p class="muted" style="margin-top:0">Pocket Register shows your balances and lets you add transactions on the go. It works with the encrypted register-data.json file your computer keeps in OneDrive.</p>
    <ol class="small muted" style="padding-left:18px"><li>Tap <b>Load register file</b>.</li><li>In the file picker, choose OneDrive, open your Account Register folder, and pick <b>register-data.json</b>.</li><li>Unlock with the same username and passphrase you use on your computer.</li></ol>
    <button class="btn" id="lLoad">Load register file</button>`}
  <p class="small muted center" style="margin-top:14px">Your data stays encrypted on this phone and in OneDrive. Version ${VERSION}</p></div>`,
  after(){ $('#lLoad').onclick=pickRegister; const f=$('#fLogin'); if(f){ f.onsubmit=e=>{e.preventDefault();unlock();}; (P.lastUser?$('#lPass'):$('#lUser')).focus(); } }});
VIEWS.home=()=>{
  const accts=openAccounts(), w=waiting();
  const assets=sum(accts.filter(a=>!isLiab(a)),balance), owed=sum(accts.filter(isLiab),balance);
  const dues=accts.filter(isLiab).map(a=>({a,d:dueOf(a),bal:balance(a)})).filter(x=>x.d&&x.d.date<=addDays(today(),14)&&(x.bal>0||x.d.amt)).sort((x,y)=>x.d.date<y.d.date?-1:1);
  const groups=GROUPS.map(g=>{ const list=accts.filter(a=>groupOf(a.type)===g.key); if(!list.length) return ''; const L=g.key!=='cash';
    return `<div class="card"><h2>${g.name}<small>${L?'owed':'balance'} ${money(sum(list,balance))}</small></h2>${list.map(a=>{ const pend=w.filter(e=>e.accountId===a.id||e.counterAccountId===a.id).length;
      return `<div class="row" data-add="${a.id}" style="cursor:pointer"><div><div class="nm">${esc(a.name)}</div><div class="sub">${esc(a.type)}${pend?` · includes ${pend} phone entr${pend===1?'y':'ies'}`:''}</div></div><div class="num">${money(balance(a))} <span class="muted">&rsaquo;</span></div></div>`; }).join('')}</div>`; }).join('');
  return {html:`<div class="card"><div class="small muted">Net worth</div><div class="big">${money(assets-owed)}</div>
      <div class="two small" style="margin-top:6px"><div>Have <b>${money(assets)}</b></div><div class="num">Owe <b>${money(owed)}</b></div></div>
      <div class="small muted" style="margin-top:8px">${P.live?'Up to date with your register':'From the register'} saved ${esc(new Date(P.env.saved).toLocaleString())}${w.length?`, plus ${w.length} entr${w.length===1?'y':'ies'} not saved to it yet`:''}.</div></div>
    ${dues.length?`<div class="card"><h2>Due in the next 14 days</h2>${dues.map(x=>{ const days=daysBetween(today(),x.d.date); return `<div class="row"><div><div class="nm">${esc(x.a.name)}</div><div class="sub">${days<0?'<span class="tag bad">Past due</span>':days===0?'Due today':`Due ${fmtDate(x.d.date)} · in ${days} day${days===1?'':'s'}`}</div></div><div class="num">${x.d.amt?money(x.d.amt):''}<div class="sub">owed ${money(x.bal)}</div></div></div>`; }).join('')}</div>`:''}
    ${groups}
    ${P.live?`<button class="btn sec" id="hRefresh">Refresh</button>`:P.handle?`<button class="btn" id="hRefresh">Reconnect to your register</button><p class="small muted center">Tap to let Pocket Register save to your register file again.</p>`:`<button class="btn sec" id="hLoad">${FSA?'Connect register file':'Load a newer register file'}</button>`}
    <p class="small muted center">Tap an account to see its register.</p>
    <div class="card" style="margin-top:14px"><label style="margin-top:0">Lock automatically</label><select id="hLock">${[[0,'Never (stay signed in until I tap Lock)'],[5,'After 5 minutes without use'],[15,'After 15 minutes without use'],[60,'After 1 hour without use']].map(([v,t])=>`<option value="${v}" ${v===LOCK_MIN?'selected':''}>${t}</option>`).join('')}</select></div>`,
  after(){ if($('#hLoad')) $('#hLoad').onclick=pickRegister; if($('#hRefresh')) $('#hRefresh').onclick=async()=>{ const r=await syncNow(true); if(r.ok){ toast(r.added||r.applied?'Saved to your register.':'Up to date.'); render(); } else toast(P.syncErr||'Could not reach your register file.',4000); };
    $('#hLock').onchange=async e=>{ LOCK_MIN=Number(e.target.value); await kvSet('autoLock',LOCK_MIN); touchSession(); toast(LOCK_MIN?`Will lock after ${LOCK_MIN===60?'1 hour':LOCK_MIN+' minutes'} without use.`:'Stays signed in until you tap Lock.'); }; $$('[data-add]').forEach(r=>r.onclick=()=>{ P.acct=r.dataset.add; P.regQ=''; P.regShow=50; go('acct'); }); }};
};
VIEWS.acct=()=>{
  const a=acctById(P.acct); if(!a){ P.tab='home'; return VIEWS.home(); }
  const L=isLiab(a), sign=L?-1:1;
  // posted transactions plus entries still waiting on this phone
  const rows=effTxns().filter(t=>t.accountId===a.id);
  rows.sort((x,y)=>x.date<y.date?-1:x.date>y.date?1:(x.seq||0)-(y.seq||0));
  let run=a.openBal||0; for(const r of rows){ if(inBalance(r,a)) run+=sign*r.amount; r.bal=inBalance(r,a)?run:null; }
  const party=r=>r.counterAccountId?`${r.amount<0?'To':'From'} ${esc(acctById(r.counterAccountId)?.name||'another account')}`:esc(r.payee||'(no payee)');
  const q=(P.regQ||'').trim().toLowerCase();
  let list=rows.slice().reverse(); if(q) list=list.filter(r=>[r.payee,r.category,r.cls,r.type,r.memo,acctById(r.counterAccountId)?.name,String(Math.abs(r.amount)/100)].some(v=>String(v||'').toLowerCase().includes(q)));
  const shown=list.slice(0,P.regShow||50);
  const cleared=sum(rows.filter(r=>r.status==='C'||r.status==='R').filter(r=>inBalance(r,a)),r=>sign*r.amount)+(a.openBal||0);
  const st=r=>r.pending?'<span class="tag warn">Pending</span>':r.pendingEdit?'<span class="tag warn">Change pending</span>':r.status==='R'?'<span class="tag good">Reconciled</span>':r.status==='C'?'<span class="tag good">Cleared</span>':'';
  P.regRows=rows;
  return {html:`<button class="btn sec" id="rBack" style="margin:0 0 12px;padding:10px">&lsaquo; Balances</button>

function deleteEntry(r){

    if(r.pending){ P.queue=P.queue.filter(e=>e.id!==r.qid); await saveQueue(); render(); return toast('Deleted.'); }

    P.queue=P.queue.filter(e=>!(e.op && e.txnId===r.id));

async function pickRegister(){
  if(FSA){
    let h; try{ [h]=await window.showOpenFilePicker({multiple:false}); }catch(e){ if(e.name!=='AbortError') toast('The file picker could not open.'); return; }
    let env; try{ env=firstJSON(await (await h.getFile()).text()); }catch(e){ env=null; }
    if(!env||env.app!==APP_ID||!env.data||env.kind==='inbox') return toast('That is not your register-data.json file. Pick the register file from your Account Register folder.',4500);
    P.handle=h; await kvSet('regHandle',h); await kvSet('regText',JSON.stringify(env)); await kvSet('regName',h.name); P.env=env; P.fileName=h.name;
    if(P.key){ P.data=null; P.key=null; P.live=false; toast('Register file connected. Unlock to continue.'); }
    return render();
  }
  return pickRegisterFile(); }
function pickRegisterFile(){ const inp=$('#filePick'); inp.value=''; inp.onchange=async()=>{ const f=inp.files[0]; if(!f) return; let env; try{ env=firstJSON(await f.text()); }catch(e){ env=null; }
    if(!env||env.app!==APP_ID||!env.data||env.kind==='inbox') return toast('That is not your register-data.json file. Pick the register file from your Account Register folder.',4500);
    await kvSet('regText',JSON.stringify(env)); await kvSet('regName',f.name); P.env=env; P.fileName=f.name;
    if(P.key){ // already unlocked: reopen with the stored key material by asking again is safer; lock and re-unlock
      P.data=null; P.key=null; toast('Newer register loaded. Unlock to see it.'); }
    render(); }; inp.click(); }
async function unlock(){
  const user=$('#lUser').value.trim(), pass=$('#lPass').value; if(!user||!pass) return $('#lErr').textContent='Enter your username and passphrase.';
  $('#lGo').disabled=true; $('#lGo').textContent='Unlocking…';
  P.live=false;
  if(P.handle){ try{ let perm=await P.handle.queryPermission({mode:'readwrite'}); if(perm!=='granted') perm=await P.handle.requestPermission({mode:'readwrite'});
      if(perm==='granted'){ const env=firstJSON(await (await P.handle.getFile()).text()); if(env&&env.app===APP_ID&&env.data){ P.env=env; P.live=true; await kvSet('regText',JSON.stringify(env)); } } }catch(e){ P.live=false; } }
  try{ const r=await openRegister(P.env,user,pass); P.data=r.data; P.key=r.key; P.user=user; await kvSet('lastUser',user); P.lastUser=user; }
  catch(e){ await new Promise(z=>setTimeout(z,600)); $('#lErr').textContent=e.message; $('#lGo').disabled=false; $('#lGo').textContent='Unlock'; return; }
  await kvSet('session',{user, key:P.key, at:Date.now()}); try{ localStorage.removeItem('pr-locked'); }catch(e){}   // the key is non-extractable: usable here, never readable
  await afterUnlock();
}
async function afterUnlock(){
  const user=P.user;
  P.data.lists ||= {}; P.data.txns ||= []; P.data.accounts ||= [];
  const sealed=await kvGet('queue:'+normUser(user)); P.queue=[];
  if(sealed){ try{ P.queue=await openJSON(sealed,P.key); }catch(e){ toast('Saved phone entries could not be opened with this register.',4000); } }
  const before=P.queue.length, done=imported(); P.queue=P.queue.filter(e=>!done.has(e.id)); if(P.queue.length!==before){ await saveQueue(); toast(`${before-P.queue.length} phone entr${before-P.queue.length===1?'y is':'ies are'} now on your computer.`); }
  P.lastActive=Date.now(); P.tab='home'; render();
  if(P.live && (waiting().length||pendingOps().length)){ const r=await syncNow(); if(r.ok && r.added) toast(`${r.added} waiting entr${r.added===1?'y was':'ies were'} saved to your register.`,4000); }
  else if(P.handle && !P.live && !P.resumed) toast('Could not reach your register file. Entries will wait on this phone.',4500);
}
// Reopen the session saved on this phone (after a pull-to-refresh, reload or reopening the app)
async function resumeSession(){
  let locked=false; try{ locked=localStorage.getItem('pr-locked')==='1'; }catch(e){}
  if(locked){ await kvSet('session',null); return false; }
  const sess=await kvGet('session'); if(!sess || !sess.key || !P.env) return false;
  if(LOCK_MIN && Date.now()-(sess.at||0) > LOCK_MIN*60000){ await kvSet('session',null); return false; }
  let env=P.env;
  P.live=false;
  if(P.handle){ try{ if(await P.handle.queryPermission({mode:'readwrite'})==='granted'){ const e=firstJSON(await (await P.handle.getFile()).text()); if(e&&e.app===APP_ID&&e.data){ env=e; P.live=true; } } }catch(e){} }
  let data; try{ data=JSON.parse(dec.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(env.iv)},sess.key,unb64(env.data)))); }
  catch(e){ if(env!==P.env){ try{ env=P.env; P.live=false; data=JSON.parse(dec.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(env.iv)},sess.key,unb64(env.data)))); }catch(e2){} } }
  if(!data){ await kvSet('session',null); return false; }   // the register's key changed: log in again
  P.env=env; if(P.live) await kvSet('regText',JSON.stringify(env));
  P.data=data; P.key=sess.key; P.user=sess.user; P.resumed=true;
  await afterUnlock(); P.resumed=false;
  return true;
}
let lastTouchSave=0;
function touchSession(){ P.lastActive=Date.now(); if(P.data && P.key && Date.now()-lastTouchSave>30000){ lastTouchSave=Date.now(); kvSet('session',{user:P.user,key:P.key,at:Date.now()}); } }
async function saveQueue(){ await kvSet('queue:'+normUser(P.user), await sealJSON(P.queue,P.key)); }
function lock(msg){ try{ localStorage.setItem('pr-locked','1'); }catch(e){} P.data=null; P.key=null; P.queue=[]; P.live=false; kvSet('session',null); closeSheet(); render(); if(msg) toast(msg); }
['touchstart','keydown','mousedown','scroll'].forEach(ev=>document.addEventListener(ev,touchSession,{passive:true,capture:true}));
setInterval(()=>{ if(P.data && LOCK_MIN && Date.now()-(P.lastActive||0) > LOCK_MIN*60000) lock(`Locked after ${LOCK_MIN} minutes without activity.`); },10000);
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState!=='visible' || !P.data) return;
  if(LOCK_MIN && Date.now()-(P.lastActive||0) > LOCK_MIN*60000) return lock(`Locked after ${LOCK_MIN} minutes without activity.`);
  if(P.live) syncNow().then(r=>{ if(r.ok && (P.tab==='home'||P.tab==='acct') && $('#modal').hidden) render(); }); });
/* ---------- save straight into register-data.json ---------- */
// Reads the latest copy of the register, adds entries made on this phone (each once, matched by its phone ID),
// and writes it back, encrypted with the same data key and logins. Done in one quick step to avoid overwriting
// changes from your computer; the computer app (v6.2+) picks up the new copy when you return to it.
function mergeEntries(d, entries){
  d.meta ||= {}; d.txns ||= []; d.lists ||= {}; for(const k of ['categories','classes','types','payees']) d.lists[k] ||= [];
  const maxSeq=Math.max(0,...d.txns.map(t=>t.seq||0)); if(!d.meta.nextTxn || d.meta.nextTxn<=maxSeq) d.meta.nextTxn=maxSeq+1;
  const nextId=()=>{ const n=d.meta.nextTxn++; return {id:'T-'+String(n).padStart(6,'0'), seq:n}; };
  const ensure=(k,name)=>{ name=(name||'').trim(); if(!name) return; const L=d.lists[k], hit=L.find(x=>x.name.toLowerCase()===name.toLowerCase()); if(hit){ if(hit.hidden) hit.hidden=false; return; } L.push(k==='payees'?{name,category:'',cls:'',type:'',hidden:false}:{name,hidden:false}); };
  const seen=new Set(d.txns.map(t=>t.mobileId).filter(Boolean)); let added=0;
  for(const e of entries){
    if(!e||!e.id||seen.has(e.id)) continue; const a=d.accounts.find(x=>x.id===e.accountId); if(!a) continue;
    const amount=Math.round(Number(e.amount)||0); if(!amount) continue;
    ensure('categories',e.category); ensure('classes',e.cls); ensure('types',e.type);
    const base={created:nowIso(),updated:nowIso(),source:'Mobile',status:'U',num:'',date:e.date||today(),category:e.category||'',cls:e.cls||'',type:e.type||'',memo:e.memo||''};
    const rec={...nextId(),...base,accountId:a.id,amount,payee:e.payee||'',mobileId:e.id,transferId:null,counterAccountId:null};
    const other=e.counterAccountId && d.accounts.find(x=>x.id===e.counterAccountId);
    if(other){ rec.transferId='X-'+uid(); rec.counterAccountId=other.id; rec.payee=''; d.txns.push(rec,{...nextId(),...base,accountId:other.id,amount:-amount,payee:'',transferId:rec.transferId,counterAccountId:a.id}); }
    else { d.txns.push(rec); if(rec.payee){ ensure('payees',rec.payee); const p=d.lists.payees.find(x=>x.name.toLowerCase()===rec.payee.toLowerCase()); Object.assign(p,{category:rec.category||p.category,cls:rec.cls||p.cls,type:(rec.type&&rec.type!=='Refund')?rec.type:p.type}); } }
    seen.add(e.id); added++;
  }
  if(added) d.meta.updated=nowIso();
  return added;
}
function ensureIn(d,k,name){ name=(name||'').trim(); if(!name) return; d.lists[k] ||= []; const L=d.lists[k], hit=L.find(x=>x.name.toLowerCase()===name.toLowerCase()); if(hit){ if(hit.hidden) hit.hidden=false; return; } L.push(k==='payees'?{name,category:'',cls:'',type:'',hidden:false}:{name,hidden:false}); }
async function writeRegister(text){
  const size=enc.encode(text).length;
  for(let i=0;i<2;i++){ const w=await P.handle.createWritable({keepExistingData:false}); await w.write(text); try{ await w.truncate(size); }catch(e){} await w.close();
    try{ if((await P.handle.getFile()).size===size) return; }catch(e){ return; } }
}
async function syncNow(interactive=false){
  if(!P.handle || !P.key) return {ok:false};
  if(P.syncing) return {ok:false};
  P.syncing=true; P.syncErr='';
  try{
    if(!P.live){ let perm=await P.handle.queryPermission({mode:'readwrite'}); if(perm!=='granted' && interactive) perm=await P.handle.requestPermission({mode:'readwrite'}); if(perm!=='granted') throw new Error('Allow access to your register file to save.'); P.live=true; }
    const env=firstJSON(await (await P.handle.getFile()).text());
    if(!env||env.app!==APP_ID||!env.data) throw new Error('Your register file could not be read.');
    let d; try{ d=JSON.parse(dec.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(env.iv)},P.key,unb64(env.data)))); }
    catch(e){ throw new Error('Your register was changed in a way this phone cannot open. Lock and unlock to continue.'); }
    d.accounts ||= [];
    const pending=waiting(), added=mergeEntries(d,pending);
    d.txns ||= []; const ops=pendingOps(), applied=applyOps(d.txns, ops, false);
    if(applied){ d.meta.updated=nowIso(); for(const o of ops) if(o.changes){ const c=o.changes; if(c.category) ensureIn(d,'categories',c.category); if(c.cls) ensureIn(d,'classes',c.cls); if(c.type) ensureIn(d,'types',c.type); if(c.payee) ensureIn(d,'payees',c.payee); } }
    let cur=env;
    if(added||applied){ const sealed=await sealJSON(d,P.key); cur={app:APP_ID,format:2,saved:nowIso(),cipher:'AES-256-GCM',wraps:env.wraps,...sealed}; await writeRegister(JSON.stringify(cur)); }
    P.env=cur; P.data=d; await kvSet('regText',JSON.stringify(cur));
    const done=imported(), opIds=new Set(ops.map(o=>o.id)); const before=P.queue.length; P.queue=P.queue.filter(e=>e.op?!opIds.has(e.id):!done.has(e.id)); if(P.queue.length!==before) await saveQueue();
    return {ok:true, added, applied};
  }catch(e){ P.syncErr=e.message||String(e); if(/Allow access|NotAllowed/i.test(P.syncErr)) P.live=false; return {ok:false, error:P.syncErr}; }
  finally{ P.syncing=false; }
}
/* ---------- send to the computer ---------- */
async function sendEntries(list){
  const d=new Date(), name=`register-inbox-${d.getFullYear()}${z(d.getMonth()+1)}${z(d.getDate())}-${z(d.getHours())}${z(d.getMinutes())}${z(d.getSeconds())}.json`;
  const sealed=await sealJSON({entries:list},P.key);
  const text=JSON.stringify({app:APP_ID,kind:'inbox',format:2,created:nowIso(),device:'Pocket Register '+VERSION,count:list.length,...sealed});
  const file=new File([text],name,{type:'application/json'});
  let shared=false;
  try{ if(navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file],title:name}); shared=true; } }
  catch(e){ if(e.name==='AbortError') return; }
  if(!shared){ const a=document.createElement('a'); a.href=URL.createObjectURL(file); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},800); }
  sheet(`<h3>Did it save to OneDrive?</h3><p class="muted">${shared?'':'Your phone downloaded <b>'+esc(name)+'</b>. Move or upload it to your Account Register folder in OneDrive. '}Mark these ${list.length} entr${list.length===1?'y':'ies'} as sent once the file is in your Account Register folder.</p>
    <button class="btn" id="sYes">Yes, it's in OneDrive</button><button class="btn sec" id="sNo">Not yet</button>`);
  $('#sYes').onclick=async()=>{ const ids=new Set(list.map(e=>e.id)); P.queue.forEach(e=>{ if(ids.has(e.id)) e.sentAt=nowIso(); }); await saveQueue(); closeSheet(); render(); toast('Marked as sent.'); };
  $('#sNo').onclick=closeSheet;
}
/* ---------- start ---------- */
(async()=>{
  P.handle=FSA?((await kvGet('regHandle'))||null):null;
  const t=await kvGet('regText'); if(t){ try{ P.env=JSON.parse(t); P.fileName=(await kvGet('regName'))||'register-data.json'; }catch(e){} }
  P.lastUser=(await kvGet('lastUser'))||''; LOCK_MIN=Number((await kvGet('autoLock'))||0);
  try{ if(await resumeSession()) return regSW(); }catch(e){}
  render(); regSW();
})();
function regSW(){
  if('serviceWorker' in navigator && location.protocol==='https:') navigator.serviceWorker.register('sw.js').catch(()=>{});
}
